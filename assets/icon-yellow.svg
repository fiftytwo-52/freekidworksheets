<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>
    <linearGradient id="bgOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1440" flood-opacity="0.28"/>
    </filter>
    <filter id="tinyShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b1440" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background app-icon square -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgOverlay)"/>

  <!-- soft background confetti -->
  <circle cx="86" cy="120" r="10" fill="#FFEAA7" opacity="0.85"/>
  <circle cx="430" cy="94" r="7" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="450" cy="410" r="12" fill="#FD79A8" opacity="0.7"/>
  <circle cx="70" cy="410" r="8" fill="#74B9FF" opacity="0.6"/>
  <rect x="410" y="330" width="14" height="14" rx="4" fill="#FFEAA7" opacity="0.7" transform="rotate(18 417 337)"/>
  <rect x="60" y="330" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.5" transform="rotate(-15 66 336)"/>

  <!-- Back sheet (peeking, slightly rotated) -->
  <g transform="rotate(-9 256 268)" filter="url(#softShadow)">
    <rect x="146" y="118" width="220" height="290" rx="14" fill="#FFEAA7"/>
  </g>

  <!-- Front A4 worksheet -->
  <g transform="rotate(4 256 268)" filter="url(#softShadow)">
    <rect x="150" y="112" width="220" height="300" rx="16" fill="#FFFFFF"/>
    <!-- top color tab -->
    <rect x="150" y="112" width="220" height="34" rx="16" fill="#FF7675"/>
    <rect x="150" y="128" width="220" height="18" fill="#FF7675"/>

    <!-- title scribble -->
    <rect x="176" y="168" width="90" height="12" rx="6" fill="#636E72" opacity="0.35"/>

    <!-- ABC row -->
    <text x="176" y="228" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="34" fill="#0984E3">A</text>
    <text x="222" y="228" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="34" fill="#00B894">B</text>
    <text x="266" y="228" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="34" fill="#FD79A8">C</text>

    <!-- dotted practice line -->
    <line x1="176" y1="252" x2="344" y2="252" stroke="#B2BEC3" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

    <!-- number row -->
    <text x="176" y="300" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="30" fill="#FDCB6E">1</text>
    <text x="216" y="300" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="30" fill="#6C5CE7">2</text>
    <text x="256" y="300" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="30" fill="#00CEC9">3</text>
    <text x="296" y="300" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="30" fill="#FF7675">4</text>

    <!-- dotted practice line 2 -->
    <line x1="176" y1="322" x2="344" y2="322" stroke="#B2BEC3" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

    <!-- gold star sticker -->
    <g transform="translate(316,352)" filter="url(#tinyShadow)">
      <path d="M0,-16 L4.5,-5 16,-4 7,3.5 10,15 0,8 -10,15 -7,3.5 -16,-4 -4.5,-5 Z" fill="#FDCB6E" stroke="#E1A20B" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Crayon -->
  <g transform="translate(118,300) rotate(-38)" filter="url(#tinyShadow)">
    <rect x="0" y="0" width="26" height="98" rx="9" fill="#00CEC9"/>
    <rect x="0" y="0" width="26" height="20" rx="9" fill="#FFFFFF" opacity="0.55"/>
    <path d="M0,98 L26,98 L13,120 Z" fill="#00B5AC"/>
  </g>

  <!-- Pencil crossing the corner -->
  <g transform="translate(330,84) rotate(52)" filter="url(#tinyShadow)">
    <rect x="0" y="0" width="20" height="140" rx="4" fill="#FDCB6E"/>
    <rect x="0" y="0" width="20" height="18" fill="#FF7675"/>
    <path d="M0,140 L20,140 L10,168 Z" fill="#E8C39E"/>
    <path d="M7,140 L13,140 L10,158 Z" fill="#4A4A4A"/>
  </g>
</svg>
